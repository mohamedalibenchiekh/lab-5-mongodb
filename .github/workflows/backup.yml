name: Database Backup

on:
  schedule:
    - cron: '0 2 * * *'  # Run at 2 AM every day
  workflow_dispatch:  # Manual trigger

jobs:
  backup:
    name: 💾 MongoDB Backup
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Install MongoDB tools
        run: |
          wget -qO - https://www.mongodb.org/static/pgp/server-7.0.asc | sudo apt-key add -
          echo "deb [ arch=amd64,arm64 ] https://repo.mongodb.org/apt/ubuntu focal/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools
      
      - name: 💾 Create backup
        run: |
          mongodump --uri="$MONGODB_URI" --out=./backup-$(date +%Y%m%d)
        env:
          MONGODB_URI: ${{ secrets.PROD_MONGODB_URI }}
      
      - name: 📦 Compress backup
        run: |
          tar -czf mongodb-backup-$(date +%Y%m%d-%H%M%S).tar.gz ./backup-*/
      
      - name: ☁️ Upload to cloud storage
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ github.run_id }}
          path: ./*.tar.gz
          retention-days: 30
      
      - name: 🗑️ Cleanup old backups
        run: |
          rm -rf ./backup-*/
          rm -f *.tar.gz