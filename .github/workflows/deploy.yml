name: Production Deployment

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # Deploy to Production
  deploy-production:
    name: 🌍 Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install dependencies
        run: npm ci --production
      
      - name: 🗄️ Test Production Connection
        run: npm run test:db
        env:
          MONGODB_URI: ${{ secrets.PROD_MONGODB_URI }}
          NODE_ENV: production
      
      - name: 🐳 Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: lab-5-mongodb:production
          build-args: |
            NODE_ENV=production
      
      - name: 🚀 Deploy to Production Server
        run: |
          echo "🚀 Deploying to production..."
          # Add your production deployment script
          # Example: Deploy to AWS, Heroku, DigitalOcean, etc.
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
      
      - name: ✅ Health Check
        run: |
          echo "Running health checks..."
          # Add health check endpoint
          curl -f http://localhost:3000/api/v1/health || exit 1
        continue-on-error: true

  # Monitor after deployment
  monitor:
    name: 📊 Monitor Deployment
    runs-on: ubuntu-latest
    needs: deploy-production
    
    steps:
      - name: 📈 Send to monitoring
        run: |
          echo "Deployment metrics sent to monitoring system"
          # Add monitoring integration (DataDog, New Relic, etc.)